##############################
# ~/.config/picom/picom.conf #
##############################

### CORE SETTINGS ###
backend = "xrender"  # More stable with NVIDIA
vsync = true
mark-wmwin-focused = true
detect-rounded-corners = true
detect-client-opacity = true
log-level = "warn"

### SHADOWS ###
shadow = true
shadow-radius = 7
shadow-offset-x = -7
shadow-offset-y = -7
shadow-opacity = 0.75
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@",
  "window_type = 'dock'",
  "window_type = 'desktop'"
]

### FADING ###
fading = true
fade-delta = 9
fade-in-step = 0.04
fade-out-step = 0.04

### OPACITY ###
inactive-opacity = 1.0
frame-opacity = 1.0
inactive-opacity-override = false
focus-exclude = [ "class_g = 'Cairo-clock'" ]
opacity-rule = [
  "80:class_g = 'URxvt'",
  "80:class_g = 'Alacritty'"
]

### PERFORMANCE ###
use-damage = true
xrender-sync-fence = true

### WINDOW TYPE RULES ###
wintypes:
{
  tooltip = {
    fade = true
    shadow = true
    opacity = 1.0
    focus = true
    full-shadow = false
  };
  dock = {
    shadow = false
    clip-shadow-above = true
  };
  dnd = { shadow = false };
  popup_menu = { opacity = 1.0 };
  dropdown_menu = { opacity = 1.0 };
};

### BLUR (DISABLED) ###
# blur-background = false  # Disabled for NVIDIA stability
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
]

### ADVANCED ###
detect-transient = true
unredir-if-possible = false
