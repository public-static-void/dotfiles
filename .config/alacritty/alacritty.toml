[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#666666"
blue = "#569CD6"
cyan = "#9CDCFE"
green = "#B5CEA8"
magenta = "#DAADD6"
red = "#F14C4C"
white = "#E5E5E5"
yellow = "#DCDCAA"

[colors.cursor]
cursor = "#EEEEEE"
text = "CellBackground"

[colors.normal]
black = "#000000"
blue = "#2472C8"
cyan = "#11A8CD"
green = "#6A9955"
magenta = "#C586C0"
red = "#CD3131"
white = "#C0C0C0"
yellow = "#CE9178"

[colors.primary]
background = "#1E1E1E"
foreground = "#D4D4D4"

[colors.selection]
background = "#5F5F87"
text = "CellForeground"

[cursor]
unfocused_hollow = true
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Beam", blinking = "On" }
blink_interval = 750

[env]
TERM = "alacritty"

[font]
size = 13

[font.bold]
family = "MesloLGSDZ Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "MesloLGSDZ Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "MesloLGSDZ Nerd Font Mono"
style = "Italic"

[font.normal]
family = "MesloLGSDZ Nerd Font Mono"
style = "Regular"

[font.offset]
x = 1
y = 1

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "NumpadMultiply"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "NumpadAdd"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "NumpadSubtract"
mods = "Control"

[scrolling]
history = 25000
multiplier = 3

[shell]
program = "/bin/zsh"

[window]
dynamic_title = true
