####################
# ~/.i3blocks.conf #
####################

#####################
# GLOBAL PROPERTIES #
#####################

# Custom script directory.
command=~/scripts/i3blocks/$BLOCK_NAME

# We use the global settings as a shortcut to define our own separator.
# Based on the default i3blocks config file.
full_text=|
align=center
color=#657665
separator=false
separator_block_width=10

#############
# BLOCKLETS #
#############

# Monitor the cpu temperature.
[temperature]
label=
color=#b1ed8b
interval=10

# Monitor overall system load.
[load_average]
label=
color=#b1ed8b
interval=30

[separator]

# Monitor memory usage.
# The type defaults to "mem" if the instance is not specified.
[memory]
label=
color=#c7e7e7
interval=30

[separator]

# Show ethernet/IP.
[iface]
instance=enp2s0
color=#799bcd
interval=1800

# Monitor network latency.
[ping]
command=echo "$(ping -q -w 2 -c 1 1.1.1.1 | tail -n1 | cut -d '/' -f 5 | awk -F. '{print $1}' | tr -d '\n') ms"
label=
color=#a883c2
interval=30

[separator]

# Show audio information.
[volume-pulseaudio]
interval=once
signal=1
SHORT_FORMAT="${SYMB} ${VOL}% [${INDEX}]"
AUDIO_HIGH_SYMBOL=
AUDIO_MED_THRESH=50
AUDIO_MED_SYMBOL=
AUDIO_LOW_THRESH=0
AUDIO_LOW_SYMBOL=
AUDIO_DELTA=5
DEFAULT_COLOR="#efabad"
MUTED_COLOR="#a0a0a0"
USE_ALSA_NAME=1

[separator]

# Show date.
[date]
label=
command=date "+%a,%_d.%b %Y"
color=#ff7f00
interval=5

# Show time.
[time]
label=
command=date  "+%H:%M%P:%S"
color=#ead57e
interval=1

[separator]

# Show pacman updates.
[pacman-updates]
command=python ~/scripts/arch-update.py -b "#5fff5f" -u "#FFFF00" -w "^linux.*" "^pacman.*"
markup=pango
interval=595

# Show trizen AUR updates.
[trizen-updates]
command=python ~/scripts/trizen-update.py -a -u "#FFFF00" -w "^linux.*" "^pacman.*"
markup=pango
interval=600

[separator]

# Show if CAPSlock key is pressed.
[keyindicator]
KEY=CAPS
markup=pango
interval=once
signal=11
separator=false

# Show if NUMblock key is pressed.
[keyindicator]
KEY=NUM
markup=pango
interval=once
signal=11

[separator]

